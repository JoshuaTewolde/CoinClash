name: Regtest E2E

# Real Breez/Spark regtest HTLC test (ADR 0002): lock → find → wrong preimage rejected → claim.
# Manual (and nightly) because it uses the real regtest network and shared test wallets.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  regtest:
    runs-on: ubuntu-latest
    env:
      NETWORK: regtest
      BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
      HOUSE_MNEMONIC: ${{ secrets.REGTEST_HOUSE_MNEMONIC }}
      REGTEST_PLAYER_A_MNEMONIC: ${{ secrets.REGTEST_PLAYER_A_MNEMONIC }}
      REGTEST_PLAYER_B_MNEMONIC: ${{ secrets.REGTEST_PLAYER_B_MNEMONIC }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check secrets are configured
        run: |
          if [ -z "$BREEZ_API_KEY" ] || [ -z "$HOUSE_MNEMONIC" ] || [ -z "$REGTEST_PLAYER_A_MNEMONIC" ] || [ -z "$REGTEST_PLAYER_B_MNEMONIC" ]; then
            echo "::error::BREEZ_API_KEY and REGTEST_{HOUSE,PLAYER_A,PLAYER_B}_MNEMONIC secrets must be set"; exit 1
          fi
      - name: Regtest HTLC smoke test
        timeout-minutes: 15
        run: pnpm --filter @coinclash/server regtest smoke
